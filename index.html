<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>网络建设与运维 · 闯关实验室</title>
<style>
:root{
  --bg:#070b12;
  --panel:rgba(20,27,42,.78);
  --panel2:rgba(28,37,56,.72);
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.16);
  --txt:#e8eefb;
  --dim:#8a9bb6;
  --cy:#22d3ee;
  --pu:#a78bfa;
  --gr:#34d399;
  --am:#fbbf24;
  --rd:#f87171;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.65;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(34,211,238,.13), transparent 62%),
    radial-gradient(760px 480px at 92% 4%, rgba(167,139,250,.13), transparent 60%),
    radial-gradient(900px 600px at 50% 108%, rgba(52,211,153,.07), transparent 62%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000 10%,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 10%,transparent 78%);
}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:20px 16px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
@media(min-width:760px){.wrap{padding:32px 24px 64px}}

/* ---------- topbar ---------- */
.topbar{display:flex;flex-direction:column;gap:12px;align-items:stretch;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  font-size:19px;color:#04121a;
  background:linear-gradient(140deg,var(--cy),var(--pu));
  box-shadow:0 6px 22px rgba(34,211,238,.34);
}
.brand h1{font-size:17px;margin:0;letter-spacing:.3px;font-weight:700}
.brand p{margin:0;font-size:11.5px;color:var(--dim);letter-spacing:.6px}
.rankbox{min-width:0}
.rankline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px}
@media(min-width:640px){
  .topbar{flex-direction:row;align-items:center;justify-content:space-between;gap:14px}
  .rankbox{flex:1 1 200px;max-width:280px;margin-left:auto}
  .rankline{justify-content:flex-end}
}
.rank-name{color:var(--cy);font-weight:700;letter-spacing:.4px}
.rank-xp{color:var(--dim);font-family:var(--mono);font-size:11.5px}
.xpbar{height:5px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cy),var(--pu));transition:width .7s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(34,211,238,.6)}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:20px;padding:20px 18px;
  background:linear-gradient(150deg,rgba(34,211,238,.1),rgba(167,139,250,.09) 55%,rgba(20,27,42,.5));
  margin-bottom:22px;
}
.hero h2{margin:0 0 6px;font-size:21px;line-height:1.35;letter-spacing:.2px}
@media(min-width:760px){.hero h2{font-size:26px}}
.hero p{margin:0;color:var(--dim);font-size:13.5px}
.hero-stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.hstat{min-width:64px}
.hstat b{display:block;font-size:20px;font-family:var(--mono);letter-spacing:.5px}
.hstat span{font-size:11.5px;color:var(--dim);letter-spacing:.5px}

/* ---------- cards ---------- */
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:13px;color:var(--dim);letter-spacing:1.6px;text-transform:uppercase}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr}}

.card{
  position:relative;text-align:left;cursor:pointer;color:inherit;font-family:inherit;
  border:1px solid var(--line);border-radius:18px;padding:16px;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s,box-shadow .22s;
  overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0;border-radius:18px;opacity:0;transition:opacity .25s;background:radial-gradient(320px 180px at 15% 0%,var(--accent-soft),transparent 70%);pointer-events:none}
.card:active{transform:scale(.985)}
@media(hover:hover){.card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.42)}.card:hover::before{opacity:1}}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-right:42px}
.icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--accent-soft);border:1px solid var(--accent-line)}
.tag{font-size:10.5px;letter-spacing:1.1px;color:var(--dim);font-family:var(--mono);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
.card h3{margin:0 0 3px;font-size:16px;letter-spacing:.2px}
.card .en{font-size:10.5px;color:var(--accent);letter-spacing:.6px;font-family:var(--mono);opacity:.85;margin-bottom:8px}
.card p.desc{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.55;min-height:2.6em}
.stars{font-size:14px;letter-spacing:3px;color:rgba(255,255,255,.14);margin-bottom:6px}
.stars i{font-style:normal;color:var(--am);text-shadow:0 0 10px rgba(251,191,36,.45)}
.card-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.go{color:var(--accent);font-weight:700}
.cheatbtn{
  position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:9px;
  display:grid;place-items:center;font-size:14px;cursor:pointer;
  border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--dim);
  transition:.2s;
}
.cheatbtn:active{transform:scale(.9);color:var(--txt)}
.card.boss{grid-column:1/-1;border-color:rgba(251,191,36,.3);background:linear-gradient(140deg,rgba(251,191,36,.09),rgba(20,27,42,.8))}
.card.boss .icon{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.3)}
.card.locked{opacity:.5;cursor:not-allowed}
.card.locked:active{transform:none}

/* ---------- badges ---------- */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{
  display:flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel2);font-size:12px;
}
.badge .bi{font-size:15px}
.badge.locked{opacity:.38;filter:grayscale(1)}
.badge small{display:block;color:var(--dim);font-size:10px;line-height:1.2}

/* ---------- game screen ---------- */
.gamehead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.iconbtn{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:16px;cursor:pointer;
}
.iconbtn:active{transform:scale(.93)}
.gtitle{flex:1;min-width:0}
.gtitle b{display:block;font-size:14.5px;letter-spacing:.2px}
.gtitle span{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.combo{
  font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--am);
  border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.1);
  padding:3px 10px;border-radius:99px;white-space:nowrap;
}
.combo.hide{opacity:0;transform:scale(.8)}
.progress{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pu));border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}

.qcard{
  border:1px solid var(--line);border-radius:18px;padding:18px 16px;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  animation:rise .38s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qtags{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.qt{font-size:10.5px;letter-spacing:.7px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.qt.main{color:var(--cy);border-color:rgba(34,211,238,.32);background:rgba(34,211,238,.08)}
.qt.multi{color:var(--pu);border-color:rgba(167,139,250,.32);background:rgba(167,139,250,.08)}
.qt.order{color:var(--am);border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.08)}
.qt.fill{color:var(--gr);border-color:rgba(52,211,153,.32);background:rgba(52,211,153,.08)}

.scenario{
  font-family:var(--mono);font-size:12.5px;line-height:1.75;color:#b9c8dd;
  border-left:2px solid var(--cy);background:rgba(34,211,238,.06);
  padding:11px 13px;border-radius:0 10px 10px 0;margin-bottom:14px;white-space:pre-wrap;
}
.scenario::before{content:"SCENARIO";display:block;font-size:9.5px;letter-spacing:2px;color:var(--cy);opacity:.75;margin-bottom:5px}

.qtext{font-size:16px;line-height:1.7;margin:0 0 16px;font-weight:600;letter-spacing:.2px}
@media(min-width:760px){.qtext{font-size:17px}}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  position:relative;display:flex;align-items:flex-start;gap:11px;
  width:100%;text-align:left;font-family:inherit;font-size:15px;line-height:1.55;
  padding:13px 14px;border-radius:14px;cursor:pointer;color:var(--txt);
  border:1px solid var(--line);background:rgba(255,255,255,.028);
  transition:border-color .18s,background .18s,transform .12s;
  min-height:50px;
}
.opt:active{transform:scale(.985)}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--dim);
  background:rgba(255,255,255,.055);border:1px solid var(--line);margin-top:1px;
  transition:.18s;
}
.opt.sel{border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.1)}
.opt.sel .k{background:rgba(34,211,238,.22);color:var(--cy);border-color:rgba(34,211,238,.5)}
.opt.correct{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.12)}
.opt.correct .k{background:var(--gr);color:#04120c;border-color:var(--gr)}
.opt.wrong{border-color:rgba(248,113,113,.6);background:rgba(248,113,113,.11)}
.opt.wrong .k{background:var(--rd);color:#1a0404;border-color:var(--rd)}
.opt.muted{opacity:.45}
.opt.dim{pointer-events:none}
.opt .num{
  flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:700;color:#04121a;
  background:linear-gradient(140deg,var(--cy),var(--pu));margin-top:1px;
  animation:pop .22s cubic-bezier(.2,1.6,.4,1);
}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.opt.picked{opacity:.45;border-style:dashed}

.seqbox{
  border:1px dashed var(--line2);border-radius:14px;padding:11px;margin-bottom:12px;
  min-height:56px;display:flex;flex-direction:column;gap:7px;background:rgba(0,0,0,.16);
}
.seqbox .ph{color:var(--dim);font-size:12.5px;text-align:center;padding:6px 0}
.seqitem{display:flex;align-items:center;gap:9px;font-size:13.5px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.28);border-radius:10px;padding:8px 11px;animation:pop .2s}
.seqitem .n{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--pu);flex:0 0 18px}

.fillwrap{display:flex;flex-direction:column;gap:10px}
.fillwrap input{
  width:100%;font-family:var(--mono);font-size:16px;padding:14px 15px;border-radius:14px;
  border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--txt);outline:none;
  transition:.2s;-webkit-appearance:none;
}
.fillwrap input:focus{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.fillwrap input::placeholder{color:rgba(138,155,182,.55)}
.hintline{font-size:12px;color:var(--am);font-family:var(--mono);min-height:1em}
.hintbtn{align-self:flex-start;font-size:12px;color:var(--dim);background:none;border:none;border-bottom:1px dashed var(--line2);cursor:pointer;padding:0 0 2px;font-family:inherit}

/* ---------- feedback ---------- */
.fb{
  margin-top:16px;border-radius:16px;padding:14px 15px;animation:rise .3s both;
  border:1px solid var(--line);background:rgba(255,255,255,.035);
}
.fb.ok{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.075)}
.fb.no{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.075)}
.fb-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:7px}
.fb.ok .fb-h{color:var(--gr)}
.fb.no .fb-h{color:var(--rd)}
.fb-b{font-size:13.5px;line-height:1.75;color:#c3d0e2}
.fb-b code{
  font-family:var(--mono);font-size:12.5px;background:rgba(34,211,238,.12);color:var(--cy);
  padding:1px 6px;border-radius:6px;border:1px solid rgba(34,211,238,.2);
  word-break:break-all;
}
.fb-b b{color:var(--txt)}

/* ---------- bottom action bar ---------- */
.actionbar{
  position:sticky;bottom:0;z-index:20;margin-top:16px;
  padding:16px 0 calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(7,11,18,0),rgba(7,11,18,.955) 26%);
  display:flex;gap:10px;
}
.btn{
  flex:1;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.4px;
  padding:15px 18px;border-radius:14px;border:1px solid var(--line2);
  background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;
  transition:transform .12s,box-shadow .2s,opacity .2s;
  min-height:52px;display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn:active{transform:scale(.98)}
.btn:disabled{cursor:not-allowed}
.btn.primary{
  background:linear-gradient(140deg,var(--cy),#3b82f6);color:#04121a;border-color:transparent;
  box-shadow:0 8px 26px rgba(34,211,238,.28);
}
.btn.primary:disabled{
  background:rgba(255,255,255,.05);color:rgba(138,155,182,.75);
  border-color:var(--line);box-shadow:none;
}
.actionbar.home{position:static;background:none;padding-top:16px}
.actionbar.home .btn{flex:0 1 240px;margin:0 auto}
.btn.primary:active{box-shadow:0 4px 14px rgba(34,211,238,.3)}
.btn.ghost{background:transparent}
.btn.grow2{flex:2}

/* ---------- result ---------- */
.result{text-align:center;padding:8px 0;animation:rise .4s both}
.result .big{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:.5px}
.result .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.bigstars{font-size:38px;letter-spacing:9px;color:rgba(255,255,255,.13);margin:6px 0 14px;line-height:1}
.bigstars i{font-style:normal;color:var(--am);text-shadow:0 0 22px rgba(251,191,36,.55);display:inline-block;animation:starIn .5s cubic-bezier(.2,1.8,.4,1) both}
.bigstars i:nth-child(1){animation-delay:.05s}
.bigstars i:nth-child(2){animation-delay:.18s}
.bigstars i:nth-child(3){animation-delay:.31s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}
.sbox{border:1px solid var(--line);border-radius:14px;padding:12px 6px;background:var(--panel2)}
.sbox b{display:block;font-size:19px;font-family:var(--mono);letter-spacing:.5px}
.sbox span{font-size:10.5px;color:var(--dim);letter-spacing:.6px}

.reviewlist{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:6px}
.rv{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:rgba(248,113,113,.045)}
.rv .rq{font-size:13.5px;font-weight:600;margin-bottom:7px;line-height:1.6}
.rv .ra{font-size:12.5px;color:var(--gr);font-family:var(--mono);margin-bottom:6px;word-break:break-word}
.rv .re{font-size:12.5px;color:var(--dim);line-height:1.7}
.rv .re code{font-family:var(--mono);font-size:11.5px;color:var(--cy);background:rgba(34,211,238,.1);padding:1px 5px;border-radius:5px}

/* ---------- cheat sheet ---------- */
.cheat-w{display:flex;flex-direction:column;gap:14px}
.csec{border:1px solid var(--line);border-radius:16px;padding:15px 16px;background:var(--panel)}
.csec h4{margin:0 0 10px;font-size:13px;letter-spacing:1.2px;color:var(--accent,var(--cy));text-transform:uppercase;font-weight:700}
.csec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.csec li{font-size:13.5px;line-height:1.7;color:#c3d0e2}
.csec code{
  font-family:var(--mono);font-size:12px;background:rgba(34,211,238,.11);color:var(--cy);
  padding:1.5px 6px;border-radius:6px;border:1px solid rgba(34,211,238,.18);word-break:break-all;
}
.csec b{color:var(--txt)}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--dim);font-size:13.5px;padding:44px 20px;border:1px dashed var(--line);border-radius:16px}
.footer{text-align:center;margin-top:34px;font-size:11.5px;color:rgba(138,155,182,.6);line-height:2}
.linkbtn{background:none;border:none;color:rgba(138,155,182,.75);font-family:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  z-index:200;padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;
  background:linear-gradient(140deg,rgba(251,191,36,.96),rgba(245,158,11,.96));color:#1a1000;
  box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none;
  max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";

/* =========================================================
   数据：关卡 · 知识卡 · 题库
   ========================================================= */
const LEVELS = [
{
  id:"ad", name:"域服务 AD DS", en:"ACTIVE DIRECTORY DOMAIN SERVICES",
  icon:"🏰", accent:"#22d3ee", tag:"第 1 关",
  desc:"把一台独立服务器变成域的“大脑”：建林、加域、管复制。",
  cheat:[
    {t:"层次结构",items:[
      "<b>林 Forest</b> › <b>树 Tree</b> › <b>域 Domain</b> › <b>组织单位 OU</b>",
      "域 = 安全边界 + 集中管理；OU = 委派管理与组策略链接的最小单位",
      "<b>全局编录 GC</b>：保存林中所有对象的<b>部分属性</b>，负责跨域查询与通用组成员解析",
      "林中第一台 DC 自动持有全部 5 个 FSMO 角色"
    ]},

const STORE_KEY = "netops-quest-v1";

function blankState(){
  const levels = {};
  LEVELS.forEach(l => levels[l.id] = {stars:0, best:0, bestXp:0, done:false});
  return {levels, badges:[], wrong:[]};
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return blankState();
    const s = JSON.parse(raw);
    const base = blankState();
    if(s.levels) Object.keys(base.levels).forEach(k=>{ if(s.levels[k]) base.levels[k] = Object.assign(base.levels[k], s.levels[k]); });
    base.badges = Array.isArray(s.badges) ? s.badges : [];
    base.wrong  = Array.isArray(s.wrong)  ? s.wrong  : [];
    return base;
  }catch(e){ return blankState(); }
}

let state = load();

function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

/* =========================================================

   ========================================================= */
const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const norm = s => String(s).toLowerCase().replace(/\s+/g,"").replace(/[。，、,.；;：:]/g,"");
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function totalXp(){
  return Object.values(state.levels).reduce((s,v)=>s+(v.bestXp||0),0);
}
function rankOf(xp){
  let r = RANKS[0], next = null;
  for(const it of RANKS){ if(xp >= it.xp) r = it; else { next = it; break; } }
  return {cur:r, next};
}
function doneCount(){
  return LEVELS.filter(l=>state.levels[l.id].done).length;
}

function toast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(),400); }, 1900);
}

/* =========================================================
   答题会话
   ========================================================= */
let S = null; // session

function prepQuestion(q){
  const base = {q, t:q.t, s:q.s, text:q.q, e:q.e, tag:q.tag};
  if(q.t === "single"){
    const disp = shuffle(q.o.map((text,i)=>({text, orig:i})));
    base.disp = disp;
    base.correct = disp.findIndex(x=>x.orig === q.a);
  } else if(q.t === "multi"){
    const disp = shuffle(q.o.map((text,i)=>({text, orig:i})));
    base.disp = disp;
    base.correct = disp.map((x,i)=> q.a.includes(x.orig) ? i : -1).filter(i=>i>=0).sort((a,b)=>a-b);
  } else if(q.t === "order"){
    base.disp = shuffle(q.o.map((text,i)=>({text, orig:i})));
  } else if(q.t === "fill"){
    base.accept = q.a.map(norm);
  }
  return base;
}

function startLevel(levelId){
  const lv = LEVELS.find(l=>l.id===levelId);
  if(!lv) return false;
  if(lv.boss && !bossUnlocked()){ toast("先把前面五个关卡通关吧"); return false; }
  const qs = shuffle(lv.questions).map(prepQuestion);
  S = {lv, qs, i:0, correct:0, combo:0, maxCombo:0, xp:0, results:[], answered:false, sel:new Set(), seq:[]};
  renderGame();
  return true;
}

function renderGame(){
  const {lv, qs, i, combo} = S;
  const item = qs[i];
  const q = item.q;
  const progress = (i / qs.length) * 100;

  const typeLabel = {single:"单选", multi:"多选", order:"排序", fill:"填空"}[item.t];
  const typeCls = {single:"main", multi:"multi", order:"order", fill:"fill"}[item.t];

  let body = "";
  if(item.t === "single" || item.t === "multi"){
    body = `<div class="opts" id="opts">` + item.disp.map((o,idx)=>`
      <button class="opt" data-opt="${idx}">
        <span class="k">${String.fromCharCode(65+idx)}</span>
        <span>${o.text}</span>
      </button>`).join("") + `</div>`;
  } else if(item.t === "order"){
    body = `
      <div class="seqbox" id="seqbox"><div class="ph">按顺序点击下面的步骤，填进这里</div></div>
      <div class="opts" id="opts">` + item.disp.map((o,idx)=>`
        <button class="opt" data-order="${idx}">
          <span class="k">${String.fromCharCode(65+idx)}</span>
          <span>${o.text}</span>
        </button>`).join("") + `</div>`;
  } else {
    body = `<div class="fillwrap">
      <input id="fillInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入命令或答案（不区分大小写）">
      <div class="hintline" id="hintline"></div>
      <button class="hintbtn" data-act="hint">需要提示？</button>
    </div>`;
  }

  app.innerHTML = `
    <div class="gamehead">
      <button class="iconbtn" data-act="quit">←</button>
      <div class="gtitle">
        <b>${lv.name}</b>
        <span>第 ${i+1} / ${qs.length} 题 · 正确 ${S.correct}</span>
      </div>
      <div class="combo ${combo>=2?"":"hide"}">连击 ×${combo}</div>
    </div>
    <div class="progress"><i style="width:${progress}%"></i></div>

    <div class="qcard">
      <div class="qtags">
        <span class="qt ${typeCls}">${typeLabel}</span>
        ${q.tag ? `<span class="qt">${q.tag}</span>` : ""}
      </div>
      ${item.s ? `<div class="scenario">${item.s}</div>` : ""}
      <p class="qtext">${item.text}</p>
      ${body}
      <div id="fb"></div>
    </div>

    <div class="actionbar" id="bar">
      <button class="btn primary" id="mainBtn" data-act="submit" disabled>提交答案</button>
    </div>
  `;

  bindGameEvents();
}

function bindGameEvents(){
  const item = S.qs[S.i];

  if(item.t === "single"){
    document.getElementById("opts").addEventListener("click", e=>{
      const b = e.target.closest("[data-opt]");
      if(!b || S.answered) return;
      const idx = +b.dataset.opt;
      S.sel = new Set([idx]);
      document.querySelectorAll("#opts .opt").forEach((el,k)=>el.classList.toggle("sel", k===idx));
      syncButton();
    });
  }

  if(item.t === "multi"){
    document.getElementById("opts").addEventListener("click", e=>{
      const b = e.target.closest("[data-opt]");
      if(!b || S.answered) return;
      const idx = +b.dataset.opt;
      if(S.sel.has(idx)) S.sel.delete(idx); else S.sel.add(idx);
      document.querySelectorAll("#opts .opt").forEach((el,k)=>el.classList.toggle("sel", S.sel.has(k)));
      syncButton();
    });
  }

  if(item.t === "order"){
    document.getElementById("opts").addEventListener("click", e=>{
      const b = e.target.closest("[data-order]");
      if(!b || S.answered) return;
      const idx = +b.dataset.order;
      const pos = S.seq.indexOf(idx);
      if(pos >= 0) S.seq.splice(pos,1); else S.seq.push(idx);
      paintSeq();
      syncButton();
    });
  }

  if(item.t === "fill"){
    const inp = document.getElementById("fillInput");
    inp.addEventListener("input", syncButton);
    inp.addEventListener("keydown", e=>{
      if(e.key === "Enter"){ e.preventDefault(); if(!document.getElementById("mainBtn").disabled) submit(); }
    });
    setTimeout(()=>inp.focus(), 120);
  }

  document.getElementById("mainBtn").addEventListener("click", ()=>{
    if(S.answered) next(); else submit();
  });
}

function paintSeq(){
  const box = document.getElementById("seqbox");
  if(!box) return;
  const item = S.qs[S.i];
  if(S.seq.length === 0){
    box.innerHTML = `<div class="ph">按顺序点击下面的步骤，填进这里</div>`;
  } else {
    box.innerHTML = S.seq.map((idx,pos)=>{
      const d = item.disp[idx];
      return `<div class="seqitem"><span class="n">${pos+1}</span><span>${d.text}</span></div>`;
    }).join("");
  }
  document.querySelectorAll("#opts .opt").forEach(el=>{
    const idx = +el.dataset.order;
    el.classList.toggle("picked", S.seq.includes(idx));
  });
}

function syncButton(){
  const item = S.qs[S.i];
  const btn = document.getElementById("mainBtn");
  if(!btn || S.answered) return;
  let ok = false;
  if(item.t === "single") ok = S.sel.size === 1;
  else if(item.t === "multi") ok = S.sel.size >= 1;
  else if(item.t === "order") ok = S.seq.length === item.disp.length;
  else if(item.t === "fill"){
    const v = (document.getElementById("fillInput")||{}).value || "";
    ok = v.trim().length > 0;
  }
  btn.disabled = !ok;
}

function submit(){
  const item = S.qs[S.i];
  const q = item.q;
  let ok = false;
  let userLabel = "";

  if(item.t === "single"){
    const idx = [...S.sel][0];
    ok = idx === item.correct;
    markOptionsSingle(item, idx);
  } else if(item.t === "multi"){
    const arr = [...S.sel].sort((a,b)=>a-b);
    ok = arr.length === item.correct.length && arr.every((v,k)=>v === item.correct[k]);
    markOptionsMulti(item, arr);
  } else if(item.t === "order"){
    const origSeq = S.seq.map(i=>item.disp[i].orig);
    ok = origSeq.every((v,k)=>v === k);
    markOptionsOrder(item, origSeq);
  } else if(item.t === "fill"){
    const inp = document.getElementById("fillInput");
    const val = inp ? inp.value : "";
    ok = item.accept.some(a => norm(val) === a || (a.length>3 && norm(val).includes(a)));
    inp.disabled = true;
    inp.style.borderColor = ok ? "rgba(52,211,153,.6)" : "rgba(248,113,113,.6)";
    userLabel = val;
  }

  S.answered = true;

  if(ok){
    S.correct++;
    S.xp += 10 + Math.min(S.combo,5)*2;
    S.combo++;
    S.maxCombo = Math.max(S.maxCombo, S.combo);
    lv_wrong_remove(q._id);
  } else {
    S.combo = 0;
    addWrong(q._id);
  }

  S.results.push({item, ok});

  const fb = document.getElementById("fb");
  const correctText = correctAnswerText(item);
  const comboNote = ok && S.combo >= 2 ? `<div style="margin-top:8px;font-size:12px;color:var(--am);font-family:var(--mono)">🔥 连击 ×${S.combo}</div>` : "";

  fb.innerHTML = `
    <div class="fb ${ok?"ok":"no"}">
      <div class="fb-h">${ok ? "✓ 正确" : "✕ 答错了"}</div>
      <div class="fb-b">
        ${!ok ? `<div style="margin-bottom:8px"><b>正确答案：</b>${correctText}</div>` : ""}
        ${!ok && userLabel ? `<div style="margin-bottom:8px;color:var(--dim)"><b>你的答案：</b>${esc(userLabel)}</div>` : ""}
        ${q.e}
      </div>
      ${comboNote}
    </div>`;

  const btn = document.getElementById("mainBtn");
  btn.textContent = (S.i === S.qs.length-1) ? "查看成绩 →" : "下一题 →";
  btn.disabled = false;
  btn.dataset.mode = "next";

  const comboEl = document.querySelector(".combo");
  if(comboEl){
    comboEl.classList.toggle("hide", S.combo < 2);
    comboEl.textContent = `连击 ×${S.combo}`;
  }
  document.querySelector(".progress i").style.width = ((S.i+1)/S.qs.length*100) + "%";

  save();
  setTimeout(()=>{
    const bar = document.getElementById("bar");
    if(bar) bar.scrollIntoView({behavior:"smooth", block:"nearest"});
  }, 60);
}

function lv_wrong_remove(id){
  const k = state.wrong.indexOf(id);
  if(k >= 0){ state.wrong.splice(k,1); return true; }
  return false;
}
function addWrong(id){
  if(!state.wrong.includes(id)) state.wrong.push(id);
}

function markOptionsSingle(item, chosen){
  document.querySelectorAll("#opts .opt").forEach((el,k)=>{
    el.classList.add("dim");
    el.classList.remove("sel");
    if(k === item.correct) el.classList.add("correct");
    if(k === chosen && chosen !== item.correct) el.classList.add("wrong");
  });
}
function markOptionsMulti(item, chosen){
  const set = new Set(chosen), corr = new Set(item.correct);
  document.querySelectorAll("#opts .opt").forEach((el,k)=>{
    el.classList.add("dim");
    el.classList.remove("sel");
    if(corr.has(k)) el.classList.add("correct");
    else if(set.has(k)) el.classList.add("wrong");
  });
}
function markOptionsOrder(item, origSeq){
  const wrongPos = new Set();
  origSeq.forEach((v,k)=>{ if(v !== k) wrongPos.add(k); });
  // 给排序结果区着色
  const box = document.getElementById("seqbox");
  if(box){
    box.querySelectorAll(".seqitem").forEach((el,k)=>{
      el.style.borderColor = wrongPos.has(k) ? "rgba(248,113,113,.5)" : "rgba(52,211,153,.5)";
      el.style.background  = wrongPos.has(k) ? "rgba(248,113,113,.1)" : "rgba(52,211,153,.1)";
    });
  }
  document.querySelectorAll("#opts .opt").forEach(el=>el.classList.add("dim"));
}

function correctAnswerText(item){
  if(item.t === "single") return `<b>${esc(item.disp[item.correct].text)}</b>`;
  if(item.t === "multi") return item.correct.map(i=>`<b>${esc(item.disp[i].text)}</b>`).join("；");
  if(item.t === "order"){
    return "<br>" + item.disp.slice().sort((a,b)=>a.orig-b.orig).map((o,i)=>`${i+1}. ${esc(o.text)}`).join("<br>");
  }
  return `<b>${esc(item.q.a[0])}</b>`;
}

function next(){
  if(S.i < S.qs.length - 1){
    S.i++;
    S.answered = false;
    S.sel = new Set();
    S.seq = [];
    renderGame();
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    finishLevel();
  }
}

/* =========================================================
   结算
   ========================================================= */
function finishLevel(){
  const {lv, correct, qs, xp, maxCombo} = S;
  const total = qs.length;
  const acc = Math.round(correct / total * 100);
  const stars = acc >= 90 ? 3 : acc >= 70 ? 2 : 1;

  const st = state.levels[lv.id];
  st.done = true;
  st.best = Math.max(st.best, acc);
  st.stars = Math.max(st.stars, stars);
  st.bestXp = Math.max(st.bestXp, xp);

  const newBadges = [];
  const grant = id => {
    if(!state.badges.includes(id)){
      state.badges.push(id);
      const b = BADGES.find(x=>x.id===id);
      if(b) newBadges.push(b);
    }
  };
  grant("first");
  if(acc === 100) grant("perfect");
  if(maxCombo >= 8) grant("combo");
  const starBadge = {ad:"ad3", pki:"pki3", gpo:"gpo3", dfs:"dfs3", iis:"iis3"}[lv.id];
  if(starBadge && stars === 3) grant(starBadge);
  if(LEVELS.filter(l=>!l.boss).every(l=>state.levels[l.id].done)) grant("all");
  if(lv.boss) grant("boss");

  save();
  renderResult({lv, acc, correct, total, stars, xp, maxCombo, newBadges});
}

function renderResult(r){
  const {lv, acc, correct, total, stars, xp, maxCombo, newBadges} = r;
  const wrongs = S.results.filter(x=>!x.ok);

  const starHtml = [0,1,2].map(i=> i<stars ? "<i>★</i>" : "★").join("");
  const title = acc >= 90 ? "通关！" : acc >= 70 ? "过关" : "勉强通过";
  const sub = acc === 100 ? "完美，一题都没错。" : acc >= 90 ? "几乎无懈可击。" : acc >= 70 ? "基础还行，错题再刷一遍更稳。" : "错题较多，建议先看知识卡再重来。";

  const wrongHtml = wrongs.length ? `
    <div class="section-title" style="margin-top:22px">错题回顾 (${wrongs.length})</div>
    <div class="reviewlist">
      ${wrongs.map(w=>`
        <div class="rv">
          <div class="rq">${esc(w.item.text)}</div>
          <div class="ra">正确答案：${correctAnswerPlain(w.item)}</div>
          <div class="re">${w.item.e}</div>
        </div>`).join("")}
    </div>` : "";

  const badgeHtml = newBadges.length ? `
    <div style="margin-top:18px;padding:14px;border-radius:16px;border:1px solid rgba(251,191,36,.32);background:rgba(251,191,36,.08);text-align:left">
      <div style="font-size:12px;letter-spacing:1.4px;color:var(--am);margin-bottom:9px">新徽章解锁</div>
      <div class="badges">
        ${newBadges.map(b=>`<div class="badge"><span class="bi">${b.icon}</span><div><div>${b.name}</div><small>${b.desc}</small></div></div>`).join("")}
      </div>
    </div>` : "";

  app.innerHTML = `
    <div class="result">
      <div class="big">${title}</div>
      <div class="sub">${lv.name} · ${sub}</div>
      <div class="bigstars">${starHtml}</div>
      <div class="statrow">
        <div class="sbox"><b>${acc}%</b><span>正确率</span></div>
        <div class="sbox"><b>${correct}/${total}</b><span>答对</span></div>
        <div class="sbox"><b>×${maxCombo}</b><span>最高连击</span></div>
      </div>
      <div class="sbox" style="margin-bottom:4px"><b>+${xp} XP</b><span>本关获得</span></div>
      ${badgeHtml}
    </div>
    ${wrongHtml}
    <div class="actionbar">
      <button class="btn ghost" data-act="home">返回地图</button>
      <button class="btn primary grow2" data-act="retry" data-level="${lv.id}">再来一次</button>
    </div>
  `;
}

function correctAnswerPlain(item){
  if(item.t === "single") return esc(item.disp[item.correct].text);
  if(item.t === "multi") return item.correct.map(i=>esc(item.disp[i].text)).join("；");
  if(item.t === "order") return item.disp.slice().sort((a,b)=>a.orig-b.orig).map((o,i)=>`${i+1}. ${esc(o.text)}`).join("  ");
  return esc(item.q.a[0]);
}

/* =========================================================
   错题本
   ========================================================= */
function renderReview(){
  const items = state.wrong.map(id=>QMAP[id]).filter(Boolean);
  app.innerHTML = `
    <div class="gamehead">
      <button class="iconbtn" data-act="home">←</button>
      <div class="gtitle"><b>错题本</b><span>${items.length} 道待复习</span></div>
    </div>
    ${items.length ? `<div class="reviewlist">
      ${items.map(it=>`
        <div class="rv">
          <div style="font-size:10.5px;letter-spacing:1px;color:var(--dim);font-family:var(--mono);margin-bottom:6px">${it.lv.name}</div>
          <div class="rq">${esc(it.q.q)}</div>
          <div class="ra">正确答案：${plainAnswer(it.q)}</div>
          <div class="re">${it.q.e}</div>
        </div>`).join("")}
    </div>
    <div class="actionbar">
      <button class="btn ghost" data-act="clearwrong">清空错题本</button>
    </div>` : `<div class="empty">还没有错题。<br>答错的题会自动出现在这里。</div>`}
  `;
}

function plainAnswer(q){
  if(q.t === "single") return esc(q.o[q.a]);
  if(q.t === "multi") return q.a.map(i=>esc(q.o[i])).join("；");
  if(q.t === "order") return q.o.map((t,i)=>`${i+1}. ${esc(t)}`).join("  ");
  return esc(q.a[0]);
}

/* =========================================================
   事件委托
   ========================================================= */
document.addEventListener("click", e=>{
  const cheat = e.target.closest("[data-cheat]");
  if(cheat){ e.stopPropagation(); renderCheat(cheat.dataset.cheat); return; }

  const card = e.target.closest(".card[data-level]");
  if(card) { startLevel(card.dataset.level); return; }

  const actEl = e.target.closest("[data-act]");
  if(!actEl) return;
  const act = actEl.dataset.act;

  if(act === "home"){ renderHome(); window.scrollTo({top:0}); }
  else if(act === "review"){ renderReview(); window.scrollTo({top:0}); }
  else if(act === "start"){ startLevel(actEl.dataset.level); }
  else if(act === "retry"){ startLevel(actEl.dataset.level); }
  else if(act === "quit"){
    if(confirm("退出本关？本关进度不会保存。")){ renderHome(); window.scrollTo({top:0}); }
  }
  else if(act === "hint"){
    const item = S.qs[S.i];
    const q = item.q;
    const hl = document.getElementById("hintline");
    if(hl) hl.textContent = q.hint ? "提示：" + q.hint : "提示：" + q.a[0].length + " 个字符";
    actEl.style.display = "none";
  }
  else if(act === "clearwrong"){
    if(confirm("清空错题本？")){ state.wrong = []; save(); renderReview(); }
  }
  else if(act === "reset"){
    if(confirm("重置全部进度？XP、徽章、错题都会清空，无法恢复。")){
      state = blankState();
      save();
      renderHome();
    }
  }
});

/* 键盘快捷键（桌面端） */
document.addEventListener("keydown", e=>{
  if(!S || !document.getElementById("opts")) return;
  const item = S.qs[S.i];
  if(S.answered){
    if(e.key === "Enter"){ e.preventDefault(); next(); }
    return;
  }
  if(e.key === "Enter"){
    const btn = document.getElementById("mainBtn");
    if(btn && !btn.disabled){ e.preventDefault(); submit(); }
    return;
  }
  const n = parseInt(e.key, 10);
  if(!isNaN(n) && n >= 1 && n <= 9){
    if(item.t === "single" || item.t === "multi"){
      const el = document.querySelector(`#opts .opt[data-opt="${n-1}"]`);
      if(el) el.click();
    } else if(item.t === "order"){
      const el = document.querySelector(`#opts .opt[data-order="${n-1}"]`);
      if(el) el.click();
    }
  }
});

/* 深链接：index.html#ad / #pki / #gpo / #dfs / #iis / #boss / #review */
function applyHash(){
  const h = (location.hash || "").replace(/^#\/?/, "").trim();
  if(!h) return false;
  if(h === "review"){ renderReview(); return true; }
  const lv = LEVELS.find(l=>l.id === h);
  if(lv && startLevel(lv.id)) return true;
  return false;
}

/* 启动 */
if(!applyHash()) renderHome();
</script>
